<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الإصلاحات - Wesad</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #667eea;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2.5em;
        }

        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 5px solid #667eea;
        }

        .test-title {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .test-result {
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            font-weight: bold;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 2px solid #bee5eb;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .icon {
            font-size: 1.5em;
            margin-left: 10px;
        }

        code {
            background: #e9ecef;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔧 اختبار الإصلاحات</h1>

        <div class="test-section">
            <div class="test-title">
                <span class="icon">1️⃣</span>
                اختبار دالة safeBtoa() مع النصوص العربية
            </div>
            <div id="test1-result" class="test-result info">
                انتظر... جاري الاختبار
            </div>
        </div>

        <div class="test-section">
            <div class="test-title">
                <span class="icon">2️⃣</span>
                اختبار تحويل SVG مع نص عربي إلى Base64
            </div>
            <div id="test2-result" class="test-result info">
                انتظر... جاري الاختبار
            </div>
        </div>

        <div class="test-section">
            <div class="test-title">
                <span class="icon">3️⃣</span>
                اختبار Content Security Policy
            </div>
            <div id="test3-result" class="test-result info">
                افتح Console للتحقق من عدم وجود أخطاء CSP
            </div>
        </div>

        <div class="test-section">
            <div class="test-title">
                <span class="icon">4️⃣</span>
                اختبار Manifest.json
            </div>
            <div id="test4-result" class="test-result info">
                انتظر... جاري الاختبار
            </div>
        </div>

        <button onclick="runAllTests()">
            🚀 إعادة تشغيل جميع الاختبارات
        </button>
    </div>

    <script>
        // دالة safeBtoa الآمنة
        function safeBtoa(str) {
            return btoa(unescape(encodeURIComponent(str)));
        }

        // اختبار 1: دالة safeBtoa
        function test1() {
            const result = document.getElementById('test1-result');
            try {
                const arabicText = 'مرحباً بك في موقع عبدالملك سعد 🎉';
                const encoded = safeBtoa(arabicText);
                const decoded = decodeURIComponent(escape(atob(encoded)));

                if (decoded === arabicText) {
                    result.className = 'test-result success';
                    result.innerHTML = `
                        ✅ نجح الاختبار!<br>
                        النص الأصلي: <code>${arabicText}</code><br>
                        تم التحويل والاسترجاع بنجاح
                    `;
                } else {
                    result.className = 'test-result error';
                    result.innerHTML = '❌ فشل الاختبار: النص لا يطابق بعد فك التشفير';
                }
            } catch (error) {
                result.className = 'test-result error';
                result.innerHTML = `❌ خطأ: ${error.message}`;
            }
        }

        // اختبار 2: SVG مع نص عربي
        function test2() {
            const result = document.getElementById('test2-result');
            try {
                const svgWithArabic = `
                    <svg width="300" height="300" xmlns="http://www.w3.org/2000/svg">
                        <rect width="300" height="300" fill="#4a90e2"/>
                        <text x="50%" y="50%" font-family="Cairo, Arial" font-size="20" fill="white" text-anchor="middle" dy=".3em">صورة المشروع</text>
                    </svg>
                `;

                const base64 = safeBtoa(svgWithArabic);
                const dataUrl = 'data:image/svg+xml;base64,' + base64;

                // إنشاء صورة للاختبار
                const img = new Image();
                img.onload = function () {
                    result.className = 'test-result success';
                    result.innerHTML = `
                        ✅ نجح الاختبار!<br>
                        تم تحويل SVG مع نص عربي إلى Base64 بنجاح<br>
                        <img src="${dataUrl}" style="max-width: 150px; margin-top: 10px; border-radius: 8px;">
                    `;
                };
                img.onerror = function () {
                    result.className = 'test-result error';
                    result.innerHTML = '❌ فشل تحميل الصورة';
                };
                img.src = dataUrl;

            } catch (error) {
                result.className = 'test-result error';
                result.innerHTML = `❌ خطأ: ${error.message}`;
            }
        }

        // اختبار 3: CSP
        function test3() {
            const result = document.getElementById('test3-result');
            const cspMeta = document.querySelector('meta[http-equiv="Content-Security-Policy"]');

            if (cspMeta) {
                const content = cspMeta.getAttribute('content');
                const hasGoogleTagManager = content.includes('googletagmanager.com');
                const hasGoogleAnalytics = content.includes('google-analytics.com');

                if (hasGoogleTagManager && hasGoogleAnalytics) {
                    result.className = 'test-result success';
                    result.innerHTML = `
                        ✅ تم العثور على CSP صحيح!<br>
                        ✓ يسمح بـ Google Tag Manager<br>
                        ✓ يسمح بـ Google Analytics<br>
                        <small>افتح Console للتأكد من عدم وجود أخطاء</small>
                    `;
                } else {
                    result.className = 'test-result error';
                    result.innerHTML = '⚠️ CSP موجود لكن قد يكون غير كامل';
                }
            } else {
                result.className = 'test-result error';
                result.innerHTML = '❌ لم يتم العثور على CSP meta tag';
            }
        }

        // اختبار 4: Manifest
        function test4() {
            const result = document.getElementById('test4-result');

            fetch('manifest.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('فشل تحميل manifest.json');
                    }
                    return response.json();
                })
                .then(manifest => {
                    result.className = 'test-result success';
                    result.innerHTML = `
                        ✅ manifest.json صالح!<br>
                        الاسم: <code>${manifest.name}</code><br>
                        الاسم المختصر: <code>${manifest.short_name}</code>
                    `;
                })
                .catch(error => {
                    result.className = 'test-result error';
                    result.innerHTML = `❌ خطأ في manifest.json: ${error.message}`;
                });
        }

        // تشغيل جميع الاختبارات
        function runAllTests() {
            test1();
            test2();
            test3();
            test4();
        }

        // تشغيل الاختبارات عند تحميل الصفحة
        window.addEventListener('load', runAllTests);
    </script>
</body>

</html>
